# HyperOS 4 Thermal Governor Profile for MT6833 (Dimensity 700)
[CPU_BALANCE]
algo_type monitor
sampling 5000
sensor mtktscpu
thresholds 55000 65000 75000 85000
actions cpu0 cpu0 cpu0 cpu0
action_info 2000000 1800000 1500000 1200000

[GPU_BALANCE]
algo_type monitor
sampling 5000
sensor mtktscpu
thresholds 65000 75000 85000
actions gpu gpu gpu
action_info 850000 700000 500000

[CHARGING_SAFETY]
algo_type monitor
sampling 10000
sensor battery
thresholds 42000 45000 48000
actions battery battery battery
action_info 3000000 2000000 1000000
